<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trexo'da maaşlar yattı mı?</title>
  <meta name="description" content="Trexo'da maaşlar yattı mı? Tek soru, tek cevap.">
  <meta property="og:title" content="Trexo'da maaşlar yattı mı?">
  <meta property="og:description" content="Hayır.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #d50000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    #soru {
      font: inherit;
      font-size: clamp(20px, 4vw, 40px);
      font-weight: 700;
      color: #d50000;
      background: #fff;
      border: 0;
      border-radius: 999px;
      padding: 0.7em 1.4em;
      cursor: pointer;
      box-shadow: 0 6px 0 #8e0000;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    #soru:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #8e0000; }
    #soru:active { transform: translateY(6px); box-shadow: 0 0 0 #8e0000; }
    #cevap {
      margin-top: 4vh;
      font-size: clamp(64px, 22vw, 320px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    #cevap[hidden] { display: none; }
    #cevap.pop { animation: pop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); }
    @keyframes pop {
      from { transform: scale(0.3); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <button id="soru" type="button">Trexo'da maaşlar yattı mı?</button>
    <div id="cevap" hidden>YATMADI</div>
  </main>
  <script>
    const cevap = document.getElementById('cevap');
    document.getElementById('soru').addEventListener('click', () => {
      cevap.hidden = false;
      cevap.classList.remove('pop');
      void cevap.offsetWidth;
      cevap.classList.add('pop');
    });
  </script>
</body>
</html>
